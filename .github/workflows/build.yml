name: Build Kernel SM6150 Cafified
on:
  push:
    branches: [ main, master, a17 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev make wget git gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm64 vendor/sm6150-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-SM6150
          path: out/arch/arm64/boot/Image.gz-dtb
