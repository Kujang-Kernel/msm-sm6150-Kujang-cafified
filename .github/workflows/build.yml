name: Build Kernel SM6150 Cafified with KSU & SUSFS
on:
  push:
    branches: [ main, master, a17 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev make wget git gcc-aarch64-linux-gnu

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/Kujang-Kernel/msm-sm6150-cafified.git kernel_source

      - name: Setup KernelSU & SUSFS
        run: |
          cd kernel_source
          # Contoh integrasi KernelSU (menggunakan ksu.sh atau manual setup)
          # Anda bisa menyesuaikan bagian ini dengan metode setup KSU pilihan Anda
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Tambahkan instruksi SUSFS di sini jika ada patch tambahan
          # git clone https://github.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=1 ../susfs
          # cp -af ../susfs/kernel_patches/*.patch ./
          # patch -p1 < 50_add_susfs_in_gki.patch || true

      - name: Compile Kernel
        run: |
          cd kernel_source
          mkdir -p out
          make O=out ARCH=arm64 vendor/sm6150-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-SM6150-KSU-SUSFS
          path: kernel_source/out/arch/arm64/boot/Image.gz-dtb
          
